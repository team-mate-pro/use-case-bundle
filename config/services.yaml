services:
  _defaults:
    autowire: true      # Automatically injects dependencies in your services.
    autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

  TeamMatePro\UseCaseBundle\:
    resource: '../src/'
    exclude:
      - '../src/Repository/'
      - '../src/UseCase/'

  TeamMatePro\UseCaseBundle\Http\RequestDependencies:
    arguments:
      $security: '@Symfony\Bundle\SecurityBundle\Security'
      $serializer: '@serializer'

  TeamMatePro\UseCaseBundle\Utils\PartialUpdateService:

  TeamMatePro\UseCaseBundle\Http\AbstractValidatedRequest:
    arguments:
      $deps: 'TeamMatePro\UseCaseBundle\Http\RequestDependencies'

  TeamMatePro\UseCaseBundle\Http\EventListener\ValidationExceptionListener:
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

  TeamMatePro\UseCaseBundle\Http\EventListener\AuthorizationExceptionListener:
    tags:
      - { name: kernel.event_listener, event: kernel.exception, method: onKernelException }

  TeamMatePro\UseCaseBundle\Http\ResponseAsBlobCsvInterface:
    class: TeamMatePro\UseCaseBundle\Http\ResultResponseFactory

  # Interface aliases — Symfony nie tworzy ich automatycznie nawet przy jednej implementacji,
  # a #[Required] setter w AbstractRestApiController oraz konstruktory listenerów wymagają,
  # by te typy były bindowalne tuż po zainstalowaniu bundla, bez dodatkowej konfiguracji.
  TeamMatePro\UseCaseBundle\Http\RestApi\ResultRendererInterface:
    alias: TeamMatePro\UseCaseBundle\Http\RestApi\ResultRestRenderer

  TeamMatePro\UseCaseBundle\Http\RestApi\HttpStatusCodeResolverInterface:
    alias: TeamMatePro\UseCaseBundle\Http\RestApi\HttpStatusCodeResolver